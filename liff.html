<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>助理</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    color-scheme: light;
    --ink: #1c1c1e; --dim: #8e8e93; --line: #e5e5ea; --bg: #f5f5f7;
    --green: #06c755; --red: #d64545; --amber: #d67b20;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0 0 40px;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
    background: var(--bg); color: var(--ink);
  }
  button, input, select { font: inherit; color: inherit; }

  header {
    position: sticky; top: 0; z-index: 3;
    background: #fff; border-bottom: 1px solid var(--line);
    padding: calc(10px + env(safe-area-inset-top)) 12px 0;
  }
  nav { display: flex; gap: 4px; }
  nav button {
    flex: 1; padding: 9px 0 11px; border: 0; background: none;
    color: var(--dim); font-size: 14px; border-bottom: 2px solid transparent;
  }
  nav button[aria-selected=true] { color: var(--ink); font-weight: 600; border-bottom-color: var(--green); }

  .pane { padding: 12px; }
  .pane[hidden] { display: none; }

  .card { background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .card + .card, .card + ul, ul + .card { margin-top: 10px; }

  form { display: flex; flex-wrap: wrap; gap: 8px; }
  form input, form select, form textarea {
    padding: 10px 12px; font-size: 16px; min-width: 0;
    border: 1px solid #d1d1d6; border-radius: 10px; background: #fff;
    font-family: inherit; resize: vertical;
  }
  details summary { font-size: 14px; color: var(--dim); cursor: pointer; }
  details[open] summary { margin-bottom: 10px; }
  form .wide { flex: 1 1 100%; }
  form .half { flex: 1 1 calc(50% - 4px); }
  form button[type=submit] {
    flex: 1 1 100%; padding: 11px; border: 0; border-radius: 10px;
    background: var(--green); color: #fff; font-weight: 600;
  }
  form button[type=submit]:disabled { background: #c7c7cc; }

  ul { list-style: none; margin: 10px 0 0; padding: 0; }
  li {
    display: flex; align-items: flex-start; gap: 12px;
    background: #fff; border-radius: 12px; padding: 13px;
    margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  li.busy { opacity: .4; }
  .body { flex: 1; min-width: 0; }
  .title { word-break: break-word; }
  .meta { margin-top: 3px; font-size: 12px; color: var(--dim); }
  .over { color: var(--red); font-weight: 600; }
  .today { color: var(--amber); font-weight: 600; }

  .box {
    flex: 0 0 22px; height: 22px; margin-top: 1px; position: relative;
    border: 2px solid #c7c7cc; border-radius: 6px;
  }
  .box.checked { background: var(--green); border-color: var(--green); }
  .box.checked::after {
    content: ""; position: absolute; left: 5px; top: 1px; width: 6px; height: 11px;
    border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(43deg);
  }
  .del { flex: 0 0 auto; border: 0; background: none; color: #c7c7cc; font-size: 19px; padding: 2px 4px; }
  .plan {
    flex: 0 0 auto; border: 1px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--dim); font-size: 12px; padding: 4px 9px;
  }
  .when { flex: 0 0 58px; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }

  /* 流程的可勾選步驟 */
  .sophead { display: flex; align-items: baseline; gap: 8px; }
  .sophead .name { font-weight: 600; flex: 1; }
  .sophead .count { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .stepline { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; }
  .stepline .box { flex: 0 0 20px; height: 20px; }
  .stepline.done span { color: var(--dim); text-decoration: line-through; }
  .reset { border: 0; background: none; color: var(--dim); font-size: 12px; padding: 8px 0 0; }

  .dayhead { margin: 16px 0 6px; font-size: 13px; font-weight: 600; color: var(--dim); }
  .dayhead:first-child { margin-top: 4px; }

  .sum { display: flex; align-items: baseline; justify-content: space-between; }
  .sum b { font-size: 26px; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: var(--green); }
  .bar i.hot { background: var(--amber); }
  .bar i.over { background: var(--red); }
  .catrow { margin-top: 11px; font-size: 13px; }
  .catrow div { display: flex; justify-content: space-between; }

  .step { display: flex; gap: 8px; font-size: 14px; margin-top: 7px; }
  .step span:first-child { color: var(--dim); flex: 0 0 18px; }

  /* 分類過濾。橫向捲動，分類再多也不會擠成兩行 */
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 10px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button {
    flex: 0 0 auto; padding: 6px 13px; font-size: 13px; white-space: nowrap;
    border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--dim);
  }
  .chips button[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: #fff; }

  .note { padding: 34px 24px; text-align: center; color: var(--dim); }
  .note b { display: block; color: var(--ink); margin-bottom: 6px; font-size: 16px; }
</style>

<header>
  <nav id="tabs">
    <button data-tab="todo" aria-selected="true">待辦</button>
    <button data-tab="event" aria-selected="false">行程</button>
    <button data-tab="expense" aria-selected="false">記帳</button>
    <button data-tab="sop" aria-selected="false">流程</button>
  </nav>
</header>

<section class="pane" id="pane-todo">
  <form id="form-todo" class="card">
    <input class="wide" id="todo-title" type="text" placeholder="要做什麼？" autocomplete="off">
    <input class="half" id="todo-due" type="date" aria-label="期限">
    <select class="half" id="todo-cat" aria-label="分類">
      <option value="">未分類</option><option>工作</option><option>家裡</option><option>購物</option><option>其他</option>
    </select>
    <button type="submit" disabled>新增待辦</button>
  </form>
  <div class="chips" id="chips-todo">
    <button type="button" data-done="0" aria-pressed="true">未完成</button>
    <button type="button" data-done="1" aria-pressed="false">已完成</button>
  </div>
  <ul id="list-todo"></ul>
  <div class="note" id="note-todo"><b>載入中…</b></div>
</section>

<section class="pane" id="pane-event" hidden>
  <form id="form-event" class="card">
    <input class="wide" id="event-title" type="text" placeholder="行程名稱" autocomplete="off">
    <input class="half" id="event-date" type="date" aria-label="日期">
    <input class="half" id="event-time" type="time" aria-label="時間">
    <select class="half" id="event-len" aria-label="長度">
      <option value="30">30 分鐘</option>
      <option value="60" selected>1 小時</option>
      <option value="90">1.5 小時</option>
      <option value="120">2 小時</option>
      <option value="180">3 小時</option>
      <option value="480">8 小時</option>
    </select>
    <input class="half" id="event-loc" type="text" placeholder="地點（可留空）" autocomplete="off">
    <button type="submit" disabled>加進行事曆</button>
  </form>
  <details class="card" id="find-free">
    <summary>找空檔</summary>
    <form id="form-free">
      <select class="half" id="free-days" aria-label="範圍">
        <option value="3">未來 3 天</option>
        <option value="7" selected>未來 7 天</option>
        <option value="14">未來 14 天</option>
      </select>
      <select class="half" id="free-mins" aria-label="需要多久">
        <option value="30">要 30 分鐘</option>
        <option value="60" selected>要 1 小時</option>
        <option value="120">要 2 小時</option>
        <option value="180">要 3 小時</option>
      </select>
      <button type="submit">找</button>
    </form>
    <div id="list-free"></div>
  </details>
  <div id="list-event"></div>
  <div class="note" id="note-event"><b>載入中…</b></div>
</section>

<section class="pane" id="pane-expense" hidden>
  <div class="card" id="expense-summary"></div>
  <form id="form-expense" class="card">
    <input class="half" id="expense-item" type="text" placeholder="項目" autocomplete="off">
    <input class="half" id="expense-amount" type="number" inputmode="numeric" placeholder="金額">
    <select class="wide" id="expense-cat" aria-label="分類"></select>
    <button type="submit" disabled>記一筆</button>
  </form>
  <ul id="list-expense"></ul>
  <div class="note" id="note-expense"><b>載入中…</b></div>
</section>

<section class="pane" id="pane-sop" hidden>
  <!-- 流程主要是拿來看的，新增很偶爾，所以收起來不佔版面 -->
  <details class="card" id="add-sop">
    <summary>＋ 新增流程</summary>
    <form id="form-sop">
      <input class="half" id="sop-name" type="text" placeholder="流程名稱" autocomplete="off">
      <input class="half" id="sop-cat" list="sop-cats" placeholder="分類" autocomplete="off">
      <datalist id="sop-cats"></datalist>
      <textarea class="wide" id="sop-steps" rows="5" placeholder="一行一個步驟&#10;結帳對帳&#10;關展示機電源&#10;鎖後門"></textarea>
      <button type="submit" disabled>建立</button>
    </form>
  </details>
  <div class="chips" id="chips-sop" hidden></div>
  <div id="list-sop"></div>
  <div class="note" id="note-sop"><b>載入中…</b></div>
</section>

<script>
const LIFF_ID = "__LIFF_ID__";
const WEEK = "日一二三四五六";
const $ = (id) => document.getElementById(id);
let token = "";
let expenseMonth = "";

// --- 基礎 ---

async function api(path, options = {}) {
  const response = await fetch("/api" + path, {
    ...options,
    headers: { "Content-Type": "application/json", "X-Line-Id-Token": token },
  });
  if (!response.ok) {
    let detail = response.statusText;
    try { detail = (await response.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return response.status === 204 ? null : response.json();
}

function note(tab, title, detail) {
  const box = $("note-" + tab);
  box.innerHTML = "";
  const strong = document.createElement("b");
  strong.textContent = title;
  box.append(strong, document.createTextNode(detail || ""));
  box.style.display = "";
}

function hideNote(tab) { $("note-" + tab).style.display = "none"; }

// 先把那一列變淡再送出，慢的時候才知道按有反應
async function act(item, run) {
  if (item.classList.contains("busy")) return;
  item.classList.add("busy");
  try { await run(); } catch (error) {
    item.classList.remove("busy");
    alert("操作失敗：" + error.message);
  }
}

function today0() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function money(n) { return "$" + Math.round(n).toLocaleString(); }

function delButton(onClick) {
  const button = document.createElement("button");
  button.className = "del";
  button.type = "button";
  button.textContent = "✕";
  button.onclick = onClick;
  return button;
}

// --- 待辦 ---

function dueLabel(due) {
  if (!due) return "";
  const days = Math.round((new Date(due + "T00:00:00") - today0()) / 86400000);
  const when = new Date(due + "T00:00:00");
  const shown = (when.getMonth() + 1) + "/" + when.getDate();
  if (days < 0) return `<span class="over">逾期 ${-days} 天 · ${shown}</span>`;
  if (days === 0) return '<span class="today">今天</span>';
  if (days === 1) return "明天";
  return shown;
}

let showingDone = false;

function renderTodos(rows) {
  $("list-todo").innerHTML = "";
  if (!rows.length) {
    return note("todo",
      showingDone ? "還沒有完成任何事" : "清單是空的",
      showingDone ? "打勾之後會出現在這裡。" : "上面打一句話就能新增。");
  }
  hideNote("todo");

  for (const row of rows) {
    const item = document.createElement("li");
    const box = document.createElement("div");
    box.className = "box";
    if (showingDone) box.classList.add("checked");
    box.onclick = () => act(item, async () => renderTodos(await api(
      showingDone ? "/todos/" + row.page_id + "/undone" : "/todos/" + row.page_id + "/done",
      { method: "POST" })));

    const body = document.createElement("div");
    body.className = "body";
    const title = document.createElement("div");
    title.className = "title";
    if (showingDone) title.style.color = "var(--dim)";
    title.textContent = row.title;
    body.appendChild(title);

    const bits = showingDone
      ? [row.done_at ? "完成於 " + row.done_at.slice(5).replace("-", "/") : "", row.category]
      : [dueLabel(row.due), row.category];
    if (bits.filter(Boolean).length) {
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML = bits.filter(Boolean).join(" · ");
      body.appendChild(meta);
    }

    item.append(box, body);

    // 未完成的才給「排」：把這件事丟到行程分頁的表單裡，順手訂個時間去做
    if (!showingDone) {
      const plan = document.createElement("button");
      plan.type = "button";
      plan.className = "plan";
      plan.textContent = "排";
      plan.onclick = () => {
        $("event-title").value = row.title;
        show("event");
      };
      item.appendChild(plan);
    }

    item.appendChild(delButton(() => {
      if (confirm(`刪除「${row.title}」？`)) {
        // 刪除的回傳固定是未完成清單，但現在可能正在看已完成，所以自己重抓
        act(item, async () => {
          await api("/todos/" + row.page_id, { method: "DELETE" });
          renderTodos(await api(todoPath()));
        });
      }
    }));
    $("list-todo").appendChild(item);
  }
}

function todoPath() { return showingDone ? "/todos/done" : "/todos"; }

async function setTodoView(done) {
  showingDone = done;
  for (const button of $("chips-todo").children) {
    button.setAttribute("aria-pressed", String((button.dataset.done === "1") === done));
  }
  try {
    renderTodos(await api(todoPath()));
  } catch (error) {
    note("todo", "載入失敗", error.message);
  }
}

$("chips-todo").onclick = (event) => {
  const flag = event.target.dataset && event.target.dataset.done;
  if (flag !== undefined) setTodoView(flag === "1");
};

// --- 行程 ---

function renderEvents(rows) {
  const wrap = $("list-event");
  wrap.innerHTML = "";
  if (!rows.length) return note("event", "未來三週沒有行程", "上面可以直接加一個。");
  hideNote("event");

  let lastDay = "";
  for (const row of rows) {
    const start = new Date(row.start);
    const day = row.start.slice(0, 10);
    if (day !== lastDay) {
      lastDay = day;
      const head = document.createElement("div");
      head.className = "dayhead";
      const days = Math.round((new Date(day + "T00:00:00") - today0()) / 86400000);
      const name = days === 0 ? "今天" : days === 1 ? "明天" : "";
      head.textContent =
        `${start.getMonth() + 1}/${start.getDate()}（${WEEK[start.getDay()]}）${name && " · " + name}`;
      wrap.appendChild(head);
    }

    const item = document.createElement("li");
    const when = document.createElement("div");
    when.className = "when";
    when.textContent = row.all_day
      ? "整天"
      : start.toTimeString().slice(0, 5) + "\n" + new Date(row.end).toTimeString().slice(0, 5);
    when.style.whiteSpace = "pre";

    const body = document.createElement("div");
    body.className = "body";
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = row.title;
    body.appendChild(title);
    if (row.location) {
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = row.location;
      body.appendChild(meta);
    }

    item.append(when, body, delButton(() => {
      // 行事曆的刪除是真的刪掉，救不回來，所以問清楚一點
      if (confirm(`從行事曆刪掉「${row.title}」？\n這個救不回來。`)) {
        act(item, async () => renderEvents(await api("/events/" + encodeURIComponent(row.id), { method: "DELETE" })));
      }
    }));
    wrap.appendChild(item);
  }
}

// --- 記帳 ---

function renderExpenses(data) {
  expenseMonth = data.month;

  const summary = $("expense-summary");
  summary.innerHTML = "";
  const head = document.createElement("div");
  head.className = "sum";
  const label = document.createElement("span");
  label.className = "meta";
  label.textContent = data.month.replace("-", " 年 ") + " 月";
  const total = document.createElement("b");
  total.textContent = money(data.total);
  head.append(label, total);
  summary.appendChild(head);

  const names = Object.keys(data.budgets).length
    ? Object.keys(data.budgets)
    : Object.keys(data.totals);
  for (const name of names) {
    const spent = data.totals[name] || 0;
    const budget = data.budgets[name] || 0;
    if (!spent && !budget) continue;

    const row = document.createElement("div");
    row.className = "catrow";
    const line = document.createElement("div");
    const left = document.createElement("span");
    left.textContent = name;
    const right = document.createElement("span");
    right.className = "meta";
    right.textContent = budget ? `${money(spent)} / ${money(budget)}` : money(spent);
    line.append(left, right);
    row.appendChild(line);

    if (budget) {
      const ratio = spent / budget;
      const bar = document.createElement("div");
      bar.className = "bar";
      const fill = document.createElement("i");
      fill.style.width = Math.min(100, ratio * 100) + "%";
      if (ratio >= 1) fill.className = "over";
      else if (ratio >= 0.8) fill.className = "hot";
      bar.appendChild(fill);
      row.appendChild(bar);
    }
    summary.appendChild(row);
  }

  const select = $("expense-cat");
  if (!select.options.length) {
    for (const name of names) select.add(new Option(name, name));
  }

  $("list-expense").innerHTML = "";
  if (!data.rows.length) return note("expense", "這個月還沒有紀錄", "上面可以記一筆。");
  hideNote("expense");

  for (const row of data.rows) {
    const item = document.createElement("li");
    const when = document.createElement("div");
    when.className = "when";
    when.textContent = row.date.slice(5).replace("-", "/");

    const body = document.createElement("div");
    body.className = "body";
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = row.item;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = money(row.amount) + " · " + row.category;
    body.append(title, meta);

    item.append(when, body, delButton(() => {
      if (confirm(`刪除「${row.item}」${money(row.amount)}？`)) {
        act(item, async () => renderExpenses(
          await api(`/expenses/${row.page_id}?month=${expenseMonth}`, { method: "DELETE" })));
      }
    }));
    $("list-expense").appendChild(item);
  }
}

// --- 流程 ---

let allSops = [];
let sopFilter = "";

function renderSopChips() {
  const chips = $("chips-sop");
  const names = [...new Set(allSops.map((row) => row.category).filter(Boolean))];

  // 新增表單的分類建議用現有的，打新的也可以
  const list = $("sop-cats");
  list.innerHTML = "";
  for (const name of names) list.appendChild(new Option(name, name));

  const hasUncategorised = allSops.some((row) => !row.category);

  // 只有一種分類時過濾器沒有意義，藏起來省版面
  if (names.length + (hasUncategorised ? 1 : 0) < 2) {
    chips.hidden = true;
    return;
  }

  const options = [["", "全部"], ...names.map((name) => [name, name])];
  if (hasUncategorised) options.push(["__none__", "未分類"]);

  chips.hidden = false;
  chips.innerHTML = "";
  for (const [value, label] of options) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    button.setAttribute("aria-pressed", String(value === sopFilter));
    button.onclick = () => {
      sopFilter = value;
      renderSops(allSops);
    };
    chips.appendChild(button);
  }
}

function renderSops(sops) {
  allSops = sops;
  renderSopChips();

  const rows = allSops.filter((row) =>
    !sopFilter || (sopFilter === "__none__" ? !row.category : row.category === sopFilter));

  const wrap = $("list-sop");
  wrap.innerHTML = "";
  if (!rows.length) {
    if (sopFilter) return note("sop", "這個分類還沒有流程", "換一個分類看看。");
    return note("sop", "還沒有任何流程",
      "在對話裡打「流程 收班流程」，換行後每行一個步驟就能建立。");
  }
  hideNote("sop");

  for (const row of rows) wrap.appendChild(sopCard(row));
}

// 打勾的進度存在這支手機裡，隔天自動歸零。
// 收班這種每天重跑一次的流程，昨天打的勾今天不該還留著。
// 也刻意不存到 Notion——這是「今天做到哪」的暫時狀態，不是資料。
function todayKey() {
  const now = new Date();
  return `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
}

function loadProgress(pageId) {
  try {
    const data = JSON.parse(localStorage.getItem("sop:" + pageId) || "{}");
    if (data.date !== todayKey()) return { done: new Set(), total: 0 };
    return { done: new Set(data.done || []), total: data.total || 0 };
  } catch (error) {
    return { done: new Set(), total: 0 };
  }
}

function saveProgress(pageId, done, total) {
  try {
    if (!done.size) localStorage.removeItem("sop:" + pageId);
    else localStorage.setItem("sop:" + pageId,
      JSON.stringify({ date: todayKey(), done: [...done], total }));
  } catch (error) { /* 無痕模式之類的，不影響閱讀 */ }
}

function sopCard(row) {
  const card = document.createElement("div");
  card.className = "card";
  card.style.marginBottom = "8px";

  const head = document.createElement("div");
  head.className = "sophead";
  const name = document.createElement("div");
  name.className = "name";
  name.textContent = row.name;
  const count = document.createElement("div");
  count.className = "count";
  head.append(name, count);
  card.appendChild(head);

  // 看「全部」時要看得出各自屬於哪一類，已經篩過了就不用重複講
  const bits = [];
  if (row.category && !sopFilter) bits.push(row.category);
  if (row.aliases.length) bits.push("也叫：" + row.aliases.join("、"));
  if (bits.length) {
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = bits.join(" · ");
    card.appendChild(meta);
  }

  const panel = document.createElement("div");
  card.appendChild(panel);

  let progress = loadProgress(row.page_id);
  const showCount = (total) => {
    count.textContent = progress.done.size ? `${progress.done.size}/${total}` : "";
  };
  showCount(progress.total);

  let steps = null;
  let open = false;

  function draw() {
    panel.innerHTML = "";
    steps.forEach((line, index) => {
      const item = document.createElement("div");
      item.className = "stepline" + (progress.done.has(index) ? " done" : "");
      const box = document.createElement("div");
      box.className = "box" + (progress.done.has(index) ? " checked" : "");
      const text = document.createElement("span");
      text.textContent = line;
      item.append(box, text);
      item.onclick = (event) => {
        event.stopPropagation();
        progress.done.has(index) ? progress.done.delete(index) : progress.done.add(index);
        saveProgress(row.page_id, progress.done, steps.length);
        showCount(steps.length);
        draw();
      };
      panel.appendChild(item);
    });

    if (progress.done.size) {
      const reset = document.createElement("button");
      reset.type = "button";
      reset.className = "reset";
      reset.textContent = "全部取消勾選";
      reset.onclick = (event) => {
        event.stopPropagation();
        progress.done = new Set();
        saveProgress(row.page_id, progress.done, steps.length);
        showCount(steps.length);
        draw();
      };
      panel.appendChild(reset);
    }
  }

  head.onclick = async () => {
    open = !open;
    if (!open) return (panel.innerHTML = "");
    if (steps) return draw();

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.style.marginTop = "8px";
    meta.textContent = "載入中…";
    panel.appendChild(meta);
    try {
      const data = await api("/sops/" + row.page_id);
      if (!data.steps.length) return (meta.textContent = "這份流程還沒有寫步驟。");
      steps = data.steps;
      draw();
    } catch (error) {
      meta.textContent = "讀取失敗：" + error.message;
    }
  };

  return card;
}

// --- 分頁 ---

const LOADERS = {
  todo: async () => renderTodos(await api("/todos")),
  event: async () => renderEvents(await api("/events")),
  expense: async () => renderExpenses(await api("/expenses")),
  sop: async () => renderSops(await api("/sops")),
};
const loaded = {};

async function show(tab) {
  for (const button of $("tabs").children) {
    button.setAttribute("aria-selected", String(button.dataset.tab === tab));
  }
  for (const name of Object.keys(LOADERS)) {
    $("pane-" + name).hidden = name !== tab;
  }
  // 只在第一次切過去時抓，之後靠寫入後的回傳保持最新
  if (loaded[tab]) return;
  loaded[tab] = true;
  try {
    await LOADERS[tab]();
  } catch (error) {
    loaded[tab] = false;
    note(tab, "載入失敗", error.message);
  }
}

$("tabs").onclick = (event) => {
  const tab = event.target.dataset && event.target.dataset.tab;
  if (tab) show(tab);
};

// Rich Menu 的每顆按鈕帶不同的 ?tab=，直接開到對應分頁。
// LINE 有時候會把 query 包進 liff.state 再轉過來，兩種都要接。
function wantedTab() {
  const here = new URLSearchParams(location.search);
  const direct = here.get("tab");
  if (direct) return direct;
  const state = here.get("liff.state");
  if (state) return new URLSearchParams(state.replace(/^\?/, "")).get("tab");
  return null;
}

// --- 表單 ---

function wire(formId, fields, submit) {
  const form = $(formId);
  const button = form.querySelector("button[type=submit]");
  const check = () => (button.disabled = !fields.every((id) => $(id).value.trim()));
  fields.forEach((id) => $(id).addEventListener("input", check));

  form.onsubmit = async (event) => {
    event.preventDefault();
    button.disabled = true;
    try {
      await submit();
    } catch (error) {
      alert("新增失敗：" + error.message);
    }
    check();
  };
}

// 找空檔。班表在行事曆裡，所以上班那幾個小時會自動被扣掉
$("form-free").onsubmit = async (event) => {
  event.preventDefault();
  const out = $("list-free");
  out.innerHTML = "";
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.style.marginTop = "10px";
  meta.textContent = "找尋中…";
  out.appendChild(meta);

  try {
    const slots = await api(`/free?days=${$("free-days").value}&minutes=${$("free-mins").value}`);
    out.innerHTML = "";
    if (!slots.length) {
      meta.textContent = "這段期間找不到夠長的空檔。";
      return out.appendChild(meta);
    }
    for (const slot of slots.slice(0, 20)) {
      const begin = new Date(slot.start);
      const finish = new Date(slot.end);
      const line = document.createElement("div");
      line.className = "stepline";
      line.style.cursor = "pointer";
      const text = document.createElement("span");
      const mins = Math.round((finish - begin) / 60000);
      const hours = mins >= 60 ? `${Math.floor(mins / 60)} 小時${mins % 60 ? ` ${mins % 60} 分` : ""}` : `${mins} 分`;
      text.textContent =
        `${begin.getMonth() + 1}/${begin.getDate()}（${WEEK[begin.getDay()]}）` +
        ` ${begin.toTimeString().slice(0, 5)}-${finish.toTimeString().slice(0, 5)}　${hours}`;
      line.appendChild(text);
      // 點一下就把日期時間填進上面的表單，不用自己抄
      line.onclick = () => {
        $("event-date").value = slot.start.slice(0, 10);
        $("event-time").value = slot.start.slice(11, 16);
        $("event-title").focus();
      };
      out.appendChild(line);
    }
  } catch (error) {
    meta.textContent = "找不到：" + error.message;
  }
};

(async () => {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) return liff.login();
    token = liff.getIDToken();
    if (!token) {
      return note("todo", "拿不到登入資訊",
        "到 LINE Developers 的 LIFF 設定把 openid 權限打開。");
    }
    $("event-date").value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000)
      .toISOString().slice(0, 10);
    const tab = wantedTab();
    await show(LOADERS[tab] ? tab : "todo");
  } catch (error) {
    note("todo", "載入失敗", String(error.message || error));
  }
})();
